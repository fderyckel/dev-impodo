name: ${COMPOSE_PROJECT_NAME:-impodo-local-rehearsal}

x-impodo-image: &impodo-image
  image: impodo-server:local

x-impodo-build: &impodo-build
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-impodo-postgres-image: &impodo-postgres-image
  image: impodo-postgres:18.6-impodo1
  pull_policy: never

x-impodo-runtime-environment: &impodo-runtime-environment
  IMPODO_DEPLOYMENT_ID: local-rehearsal
  IMPODO_PUBLIC_URL: https://localhost:${IMPODO_PROXY_PORT:-8443}
  IMPODO_TRUSTED_PROXY_CIDRS: 172.30.10.2/32
  IMPODO_WEB_BIND_HOST: 0.0.0.0
  IMPODO_WEB_BIND_PORT: "8000"
  IMPODO_DRAIN_TIMEOUT_SECONDS: "30"
  IMPODO_POSTGRES_DSN_FILE: /run/secrets/impodo/postgres-runtime-dsn
  IMPODO_ARTIFACT_ROOT: /var/lib/impodo/artifacts
  IMPODO_RUNTIME_ROOT: /var/lib/impodo/runtime
  IMPODO_TEMP_ROOT: /var/tmp/impodo
  IMPODO_SECRET_PROVIDER: files
  IMPODO_SECRET_ROOT: /run/secrets/impodo
  IMPODO_WORKER_CAPACITY: "1"
  IMPODO_LOG_LEVEL: INFO
  IMPODO_ODOO_EGRESS_MODE: disabled

x-impodo-runtime-security: &impodo-runtime-security
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true

services:
  postgres:
    <<: *impodo-postgres-image
    build:
      context: ./images/postgres
    environment:
      POSTGRES_DB: impodo
      POSTGRES_USER: impodo_bootstrap
      POSTGRES_PASSWORD_FILE: /run/impodo-postgres-secrets/postgres-bootstrap-password
      PGDATA: /var/lib/postgresql/18/docker
    depends_on:
      volume-provisioner:
        condition: service_completed_successfully
    volumes:
      - postgres-data:/var/lib/postgresql
      - impodo-postgres-secrets:/run/impodo-postgres-secrets:ro
      - impodo-postgres-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql
      - /tmp
    read_only: true
    shm_size: 256m
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --quiet --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      control:
        ipv4_address: 172.30.20.2

  volume-provisioner:
    <<: *impodo-postgres-image
    user: "0:0"
    entrypoint:
      - /bin/sh
      - /opt/impodo/provision-runtime-secrets.sh
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres-bootstrap-password
      - postgres-runtime-password
      - postgres-migration-password
      - postgres-runtime-dsn
      - postgres-migration-dsn
      - platform-admin-password
      - identifier-digest-key
    volumes:
      - ./local-rehearsal/provision-runtime-secrets.sh:/opt/impodo/provision-runtime-secrets.sh:ro
      - ./postgres/init/010-impodo-roles.sh:/opt/impodo/010-impodo-roles.sh:ro
      - impodo-postgres-init:/run/impodo-postgres-init
      - impodo-postgres-secrets:/run/impodo-postgres-secrets
      - impodo-runtime-secrets:/run/impodo-runtime-secrets
      - impodo-bootstrap-secrets:/run/impodo-bootstrap-secrets
      - impodo-migration-secrets:/run/impodo-migration-secrets
      - impodo-artifacts:/var/lib/impodo/artifacts
      - caddy-data:/data
      - caddy-config:/config
    network_mode: none
    restart: "no"

  migrate:
    <<: [*impodo-image, *impodo-build, *impodo-runtime-security]
    command:
      - migrate
    environment:
      IMPODO_DEPLOYMENT_ID: local-rehearsal
      IMPODO_POSTGRES_MIGRATION_DSN_FILE: /run/secrets/impodo/postgres-migration-dsn
      IMPODO_SECRET_PROVIDER: files
      IMPODO_SECRET_ROOT: /run/secrets/impodo
    depends_on:
      postgres:
        condition: service_healthy
      volume-provisioner:
        condition: service_completed_successfully
    volumes:
      - impodo-migration-secrets:/run/secrets/impodo:ro
    tmpfs:
      - /var/tmp/impodo:uid=10001,gid=10001,mode=0750,noexec,nosuid,nodev
    networks:
      control:
        ipv4_address: 172.30.20.4
    restart: "no"

  web:
    <<: [*impodo-image, *impodo-runtime-security]
    command:
      - web
    environment: *impodo-runtime-environment
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - impodo-artifacts:/var/lib/impodo/artifacts
      - impodo-runtime-secrets:/run/secrets/impodo:ro
    tmpfs:
      - /var/lib/impodo/runtime:uid=10001,gid=10001,mode=0750,noexec,nosuid,nodev
      - /var/tmp/impodo:uid=10001,gid=10001,mode=0750,noexec,nosuid,nodev
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      application:
        ipv4_address: 172.30.10.3
      control:
        ipv4_address: 172.30.20.3

  worker:
    <<: [*impodo-image, *impodo-runtime-security]
    profiles:
      - worker
    command:
      - worker
    environment: *impodo-runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - impodo-artifacts:/var/lib/impodo/artifacts
      - impodo-runtime-secrets:/run/secrets/impodo:ro
    tmpfs:
      - /var/lib/impodo/runtime:uid=10001,gid=10001,mode=0750,noexec,nosuid,nodev
      - /var/tmp/impodo:uid=10001,gid=10001,mode=0750,noexec,nosuid,nodev
    restart: "no"
    networks:
      control:
        ipv4_address: 172.30.20.5

  admin-bootstrap:
    <<: [*impodo-image, *impodo-runtime-security]
    profiles:
      - admin
    command:
      - admin
      - bootstrap
      - --login-email
      - ${IMPODO_BOOTSTRAP_LOGIN_EMAIL:-}
      - --display-name
      - ${IMPODO_BOOTSTRAP_DISPLAY_NAME:-}
      - --password-file
      - /run/secrets/impodo/platform-admin-password
    environment:
      IMPODO_DEPLOYMENT_ID: local-rehearsal
      IMPODO_POSTGRES_DSN_FILE: /run/secrets/impodo/postgres-runtime-dsn
      IMPODO_SECRET_PROVIDER: files
      IMPODO_SECRET_ROOT: /run/secrets/impodo
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - impodo-bootstrap-secrets:/run/secrets/impodo:ro
    tmpfs:
      - /var/tmp/impodo:uid=10001,gid=10001,mode=0750,noexec,nosuid,nodev
    networks:
      control:
        ipv4_address: 172.30.20.6
    restart: "no"

  proxy:
    image: impodo-caddy:2.11.7-impodo1
    pull_policy: never
    build:
      context: ./images/caddy
    user: "10001:10001"
    environment:
      IMPODO_PROXY_HOST: localhost
    depends_on:
      web:
        condition: service_healthy
    ports:
      - 127.0.0.1:${IMPODO_PROXY_PORT:-8443}:8443
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0750,noexec,nosuid,nodev
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --insecure
        - https://localhost:8443/health/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      edge: {}
      application:
        ipv4_address: 172.30.10.2

secrets:
  postgres-bootstrap-password:
    file: ./.local/secrets/postgres-bootstrap-password
  postgres-runtime-password:
    file: ./.local/secrets/postgres-runtime-password
  postgres-migration-password:
    file: ./.local/secrets/postgres-migration-password
  postgres-runtime-dsn:
    file: ./.local/secrets/postgres-runtime-dsn
  postgres-migration-dsn:
    file: ./.local/secrets/postgres-migration-dsn
  platform-admin-password:
    file: ./.local/secrets/platform-admin-password
  identifier-digest-key:
    file: ./.local/secrets/identifier-digest-key

volumes:
  postgres-data: {}
  impodo-postgres-init: {}
  impodo-postgres-secrets: {}
  impodo-artifacts: {}
  impodo-runtime-secrets: {}
  impodo-bootstrap-secrets: {}
  impodo-migration-secrets: {}
  caddy-data: {}
  caddy-config: {}

networks:
  edge: {}
  application:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/29
  control:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/29
