{% if read_credential_prompt and read_credential_prompt.available %}
  <p class="muted" data-saved-read-credential role="status">
    <strong>{{ 'Source key' if workspace_state.source_mode.value == 'ODOO' else 'Checking key' }}:</strong>
    {{ read_credential_prompt.status_label }}. {{ read_credential_prompt.guidance }}
    <a href="/workspaces/{{ workspace_id }}/target">Review Odoo access</a>
  </p>
{% endif %}
