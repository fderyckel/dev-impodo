{% if card.action_method == 'post' %}
  <form method="post" action="{{ card.action_url }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="button action"{% if card.current %} data-next-step="100"{% endif %} type="submit">{{ card.action_label }}</button>
  </form>
{% else %}
  <a class="button action"{% if card.current %} data-next-step="100"{% endif %} href="{{ card.action_url }}">{{ card.action_label }}</a>
{% endif %}
