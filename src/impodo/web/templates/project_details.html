{% extends "base.html" %}
{% block title %}Project details · Impodo{% endblock %}
{% block content %}
  {% set step = "details" %}
  {% include "_steps.html" %}
  <section class="form-card">
    <p class="eyebrow">Project setup · Project details</p>
    <h1>{{ project.name }}</h1>
    <form method="post" action="/projects/{{ project.project_id }}/details">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="revision" value="{{ project.revision }}">
      <div class="form-grid">
        <label>
          Project name
          <input name="name" maxlength="200" required value="{{ project.name }}">
        </label>
        <label>
          Source system
          <select name="source_system" required>
            {% for source in source_systems %}
              <option value="{{ source }}" {% if project.source_system == source %}selected{% endif %}>{{ source }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Source export status
          <select name="export_status" required>
            <option value="PLANNED" {% if project.export_status.value == "PLANNED" %}selected{% endif %}>Source export planned</option>
            <option value="RECEIVED" {% if project.export_status.value == "RECEIVED" %}selected{% endif %}>Source files received</option>
          </select>
        </label>
        <label>
          Source export date
          <input type="date" name="export_date" value="{{ project.export_date.isoformat() if project.export_date else '' }}">
          <small>Date the source system produced the files—not an Odoo import date. Required before registration.</small>
        </label>
      </div>
      <label>
        Description
        <textarea name="description" rows="4" maxlength="2000">{{ project.description }}</textarea>
      </label>
      <div class="actions">
        <a class="button secondary" href="/projects">Save and exit</a>
        <button class="button primary" type="submit">Save and continue</button>
      </div>
    </form>
  </section>
{% endblock %}
