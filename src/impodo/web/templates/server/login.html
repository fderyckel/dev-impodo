{% extends "server/base.html" %}
{% block title %}Sign in · Impodo{% endblock %}
{% block content %}
<h1>Sign in to Impodo</h1><p>Use your Impodo account email and password.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <label>Login email <input name="login_email" type="email" maxlength="320" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" maxlength="1024" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
</form>
<p><a href="/forgot-password">Forgot your password?</a></p>
{% endblock %}
