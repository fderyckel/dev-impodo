{% extends "base.html" %}
{% block title %}New Recipe · Impodo{% endblock %}
{% block content %}
  <section class="form-card narrow">
    <p class="eyebrow">Recipe setup · Start</p>
    <h1>Create a migration Recipe</h1>
    <p>This creates Recipe authoring data version 1. You can finish it over several sessions.</p>
    <form method="post" action="/recipes/new" data-single-submit>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input
        type="hidden"
        name="creation_request_id"
        value="{{ values.get('creation_request_id', '') }}"
      >
      <label>
        Recipe name
        <input name="name" maxlength="200" required value="{{ values.get('name', '') }}">
        <small>Use the reusable business purpose, such as Customer migration.</small>
      </label>
      <label>
        Source system
        <select name="source_system" required>
          <option value="">Choose a source</option>
          {% for source in source_systems %}
            <option value="{{ source }}" {% if values.get('source_system') == source %}selected{% endif %}>{{ source }}</option>
          {% endfor %}
        </select>
      </label>
      <fieldset>
        <legend>Where should Impodo read the source data?</legend>
        <div class="mode-grid">
          <label class="mode-card">
            <input type="radio" name="source_mode" value="FILE"
              {% if values.get('source_mode', 'FILE') == 'FILE' %}checked{% endif %}>
            <span>
              <strong>Use files</strong>
              <small>Upload governed CSV or XLSX exports.</small>
            </span>
          </label>
          <label class="mode-card">
            <input type="radio" name="source_mode" value="ODOO"
              {% if values.get('source_mode') == 'ODOO' %}checked{% endif %}>
            <span>
              <strong>Use data already in Odoo</strong>
              <small>Connect read-only and choose existing Odoo records after setup.</small>
            </span>
          </label>
        </div>
      </fieldset>
      <div class="actions">
        <a class="button secondary" href="/recipes">Cancel</a>
        <button
          class="button primary"
          type="submit"
          data-submitting-label="Creating Recipe..."
        >Create Recipe</button>
      </div>
    </form>
  </section>
{% endblock %}
