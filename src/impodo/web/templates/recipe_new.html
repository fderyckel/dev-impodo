{% extends "base.html" %}
{% block title %}New project · Impodo{% endblock %}
{% block content %}
  <section class="form-card narrow">
    <p class="eyebrow">New project</p>
    <h1>What are you working on?</h1>
    <p>Name the project and choose where Impodo should read the source data.</p>
    <form method="post" action="/recipes/new" data-single-submit>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input
        type="hidden"
        name="creation_request_id"
        value="{{ values.get('creation_request_id', '') }}"
      >
      <label>
        Project name
        <input name="name" maxlength="200" required value="{{ values.get('name', '') }}">
        <small>For example: Customer migration.</small>
      </label>
      <fieldset>
        <legend>Where should Impodo read the source data?</legend>
        <div class="mode-grid">
          <label class="mode-card">
            <input type="radio" name="source_mode" value="FILE"
              {% if values.get('source_mode', 'FILE') == 'FILE' %}checked{% endif %}>
            <span>
              <strong>Use files</strong>
              <small>Add CSV or XLSX files, then review their tables.</small>
            </span>
          </label>
          <label class="mode-card">
            <input type="radio" name="source_mode" value="ODOO"
              {% if values.get('source_mode') == 'ODOO' %}checked{% endif %}>
            <span>
              <strong>Use data already in Odoo</strong>
              <small>Prepare records from this same database. Moving records to another Odoo database is not supported yet.</small>
            </span>
          </label>
        </div>
      </fieldset>
      <div class="actions">
        <a class="button secondary" href="/recipes">Cancel</a>
        <button
          class="button primary"
          type="submit"
          data-submitting-label="Creating project..."
        >Continue</button>
      </div>
    </form>
  </section>
{% endblock %}
