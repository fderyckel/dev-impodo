{% extends "base.html" %}
{% block title %}Governance · Impodo{% endblock %}
{% block content %}
  {% set step = "governance" %}
  {% include "_steps.html" %}
  <section class="form-card">
    <p class="eyebrow">Project setup · People</p>
    <h1>Who is responsible for this project?</h1>
    <form method="post" action="/projects/{{ project.project_id }}/governance">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="revision" value="{{ project.revision }}">
      <div class="form-grid">
        <label>
          Responsible data manager
          <input name="data_manager" maxlength="200" required value="{{ project.data_manager }}">
        </label>
        <label>
          Functional owner
          <input name="functional_owner" maxlength="200" required value="{{ project.functional_owner }}">
        </label>
        <label>
          Business unit or legal entity
          <input name="business_unit" maxlength="200" value="{{ project.business_unit }}">
        </label>
        <label>
          Data classification
          <select name="data_classification" required>
            {% for value, label in [("INTERNAL", "Internal"), ("CONFIDENTIAL", "Confidential"), ("RESTRICTED", "Restricted / customer data")] %}
              <option value="{{ value }}" {% if project.data_classification.value == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Retention after acceptance (days)
          <input type="number" name="retention_days" min="1" max="3650" required value="{{ project.retention_days }}">
          <small>
            Maximum time Impodo may retain this local project after the functional
            owner formally accepts the migration outcome. Count from acceptance,
            not the source export date. This does not delete data automatically;
            follow the approved disposal process. Default: 90 days.
          </small>
        </label>
      </div>
      <label class="checkbox">
        <input type="checkbox" name="support_access" {% if project.support_access %}checked{% endif %}>
        Authorised support personnel may access this local project.
      </label>
      <div class="actions">
        <a class="button secondary" href="/projects/{{ project.project_id }}/details">Back</a>
        <button class="button primary" type="submit">Save and continue</button>
      </div>
    </form>
  </section>
{% endblock %}
