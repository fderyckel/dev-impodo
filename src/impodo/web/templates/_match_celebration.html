<div class="match-celebration" data-match-celebration hidden>
  <div class="match-celebration-effects" aria-hidden="true">
    <div class="match-celebration-wash"></div>
    <div class="match-celebration-confetti" data-match-confetti></div>
    <span class="match-celebration-star star-left">✦</span>
    <span class="match-celebration-star star-right">✦</span>
  </div>
  <section class="match-celebration-banner" aria-label="Match data complete">
    <div role="status" aria-live="polite" aria-atomic="true">
      <p class="match-celebration-kicker">Match data complete</p>
      <h2>Good Job Hugo!</h2>
      <p>Matches confirmed. On to Prepare data!</p>
    </div>
    <button class="button secondary" type="button" data-match-celebration-dismiss>Continue</button>
  </section>
</div>
