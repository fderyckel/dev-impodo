<dialog class="confirmation-dialog source-rule-remove-dialog" aria-labelledby="source-rule-remove-title" data-source-remove-dialog>
  <div class="dialog-heading">
    <h2 id="source-rule-remove-title" data-source-remove-title>Remove saved change?</h2>
    <form method="dialog">
      <button class="dialog-close" type="submit" aria-label="Close dialog">×</button>
    </form>
  </div>
  <p class="source-rule-remove-name" data-source-remove-name></p>
  <div class="dialog-actions">
    <form method="dialog">
      <button class="button navigation" type="submit" autofocus>Cancel</button>
    </form>
    <button class="button destructive" data-button-delete type="button" data-source-remove-confirm><span class="button-delete-icon" aria-hidden="true">🗑︎</span> <span data-source-remove-confirm-label>Remove change</span></button>
  </div>
</dialog>
