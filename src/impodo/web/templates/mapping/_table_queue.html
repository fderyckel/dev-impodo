<section class="form-card mapping-table-queue" aria-label="Tables to match">
  {% if matching_order %}
    <nav class="mapping-table-cards" aria-label="Choose a table">
      <ol class="mapping-table-queue-list">
        {% for item in matching_order.rows %}
          <li>
            <a class="mapping-table-card {{ item.status_class }}" href="{{ item.edit_url }}"
               data-mapping-table-link data-mapping-table-card="{{ item.dataset_id }}"
               data-mapping-table-state="{{ item.status_class }}"{% if item.active %} aria-current="step"{% endif %}>
              <strong>{{ item.dataset_name }} <span data-mapping-table-complete aria-hidden="true"{% if item.status_class != 'ready' %} hidden{% endif %}>✓</span></strong>
              <small data-mapping-table-status>{{ item.status_label }}</small>
            </a>
          </li>
        {% endfor %}
      </ol>
    </nav>
  {% endif %}
  {% if matching_order %}
    <details class="mapping-journey-order-details"{% if request.query_params.get("order_panel") == "1" %} open{% endif %}>
      <summary>Change table order</summary>
      {% include "mapping/_matching_order.html" %}
    </details>
  {% endif %}
</section>
