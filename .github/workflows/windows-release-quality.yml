name: Windows release quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/install-internal-release.ps1
      - scripts/internal_release.py
      - requirements.windows-py312.lock
      - tests/platform/windows/**
      - .github/workflows/windows-release-quality.yml

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Run Windows-owned tests
        run: >-
          uv run --frozen --group quality python -m unittest discover
          -s tests/platform/windows -t . -p "test_*.py" -v
