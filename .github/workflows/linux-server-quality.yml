name: Linux server quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - LICENSE
      - README.md
      - pyproject.toml
      - uv.lock
      - deploy/**
      - src/**
      - tests/architecture/test_linux_container_contract.py
      - tests/platform/linux/**
      - tests/integration/postgresql/**
      - tests/integration/web/test_server_*.py
      - .github/workflows/linux-server-quality.yml
  pull_request:
    paths:
      - .dockerignore
      - LICENSE
      - README.md
      - pyproject.toml
      - uv.lock
      - deploy/**
      - src/**
      - tests/architecture/test_linux_container_contract.py
      - tests/platform/linux/**
      - tests/integration/postgresql/**
      - tests/integration/web/test_server_*.py
      - .github/workflows/linux-server-quality.yml

permissions:
  contents: read

jobs:
  linux-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMPODO_TEST_POSTGRES_DSN: >-
        postgresql://postgres:impodo-test-only@127.0.0.1:54329/impodo_test?sslmode=disable
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: impodo_test
          POSTGRES_PASSWORD: impodo-test-only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready --quiet --username postgres --dbname impodo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Run Linux-owned tests
        run: >-
          uv run --frozen --group quality python -m unittest discover
          -s tests/platform/linux -t . -p "test_*.py" -v

      - name: Run server integration contracts
        run: >-
          uv run --frozen --group quality --extra test python -m unittest
          tests.integration.postgresql.test_startup
          tests.integration.postgresql.test_migrations
          tests.integration.postgresql.test_coordination
          tests.integration.postgresql.test_project_catalogue
          tests.application.test_cross_store_coordination
          tests.integration.web.test_server_runtime_contract
          tests.integration.web.test_server_runtime_coordination
          tests.integration.web.test_server_migration_command
          tests.integration.web.test_server_web_process -v

  image-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: impodo-server:ci
      SBOM_GENERATOR: docker/buildkit-syft-scanner@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the pinned image for scanning
        run: >-
          docker buildx build
          --file deploy/Dockerfile
          --pull
          --load
          --provenance=false
          --sbom=false
          --tag "${IMAGE_TAG}"
          .

      - name: Reject fixable critical or high vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "${TRIVY_IMAGE}" image \
            --docker-host unix:///var/run/docker.sock \
            --scanners vuln \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            "${IMAGE_TAG}"

      - name: Export maximum provenance and SPDX SBOM
        run: |
          evidence_directory="${RUNNER_TEMP}/impodo-image-evidence"
          evidence_tar="${evidence_directory}/rootfs-with-attestations.tar"
          mkdir -p "${evidence_directory}"
          docker buildx build \
            --file deploy/Dockerfile \
            --pull \
            --provenance=mode=max \
            --sbom="generator=${SBOM_GENERATOR}" \
            --output "type=tar,dest=${evidence_tar}" \
            .
          tar --extract \
            --file "${evidence_tar}" \
            --directory "${evidence_directory}" \
            provenance.json sbom.spdx.json
          rm "${evidence_tar}"
          test -s "${evidence_directory}/provenance.json"
          test -s "${evidence_directory}/sbom.spdx.json"

      - name: Retain supply-chain evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impodo-server-supply-chain-evidence
          path: |
            ${{ runner.temp }}/impodo-image-evidence/provenance.json
            ${{ runner.temp }}/impodo-image-evidence/sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
