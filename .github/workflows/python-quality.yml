# Keep this historical workflow name so existing required-check rules continue
# to match while the job now runs the complete repository gate.
name: Python quality

on:
  workflow_dispatch:
    inputs:
      workflow_liveness:
        description: Measure four workflow pages with 25,000 rows on Windows and macOS
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Run the complete repository quality gate
        run: uv run --frozen --group quality python scripts/check_repository_quality.py
        env:
          IMPODO_CI_BEFORE: ${{ github.event.before }}

  behavior:
    name: Behavior (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    # Whole-module shards keep slow host runs bounded without dropping tests.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Preserve source bytes for cross-platform build comparison
        if: inputs.workflow_liveness && runner.os == 'Windows' && matrix.shard == 1
        run: git config --global core.autocrlf false
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Run portable behavioral contracts
        run: >-
          uv run --frozen --group quality --extra test python -m pytest -q tests
          --ignore=tests/platform --ignore=tests/performance --tb=short
          -p scripts.pytest_sharding --shard-count 4 --shard-index ${{ matrix.shard }}
      - name: Run default performance contracts
        if: runner.os == 'Linux' && matrix.shard == 1
        run: uv run --frozen --group quality --extra test pytest -q tests/performance

      - name: Qualify workflow liveness
        if: inputs.workflow_liveness && runner.os != 'Linux' && matrix.shard == 1
        env:
          IMPODO_RUN_PREFLIGHT_SCALE: '1'
          IMPODO_PREFLIGHT_SCALE_RUNS: '1'
          IMPODO_WORKFLOW_LIVENESS_OUTPUT: ${{ runner.temp }}/workflow-liveness.json
        run: >-
          uv run --frozen --python 3.12.14 --extra test --group quality
          python -m pytest -q tests/performance/test_preflight_scale.py
      - name: Retain workflow liveness measurements
        if: always() && inputs.workflow_liveness && runner.os != 'Linux' && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-liveness-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/workflow-liveness.json
          if-no-files-found: error

  quality:
    name: quality
    if: always()
    needs: [portable, behavior]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the historical required-check contract
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          BEHAVIOR_RESULT: ${{ needs.behavior.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          test "$BEHAVIOR_RESULT" = success
