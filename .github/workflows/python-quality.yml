# Keep this historical workflow name so existing required-check rules continue
# to match while the job now runs the complete repository gate.
name: Python quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Run the complete repository quality gate
        run: uv run --frozen --group quality python scripts/check_repository_quality.py
        env:
          IMPODO_CI_BEFORE: ${{ github.event.before }}

  behavior:
    name: Behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Run portable behavioral contracts
        run: >-
          uv run --frozen --group quality --extra test pytest -q tests
          --ignore=tests/platform --ignore=tests/performance --tb=short
      - name: Run default performance contracts
        if: runner.os == 'Linux'
        run: uv run --frozen --group quality --extra test pytest -q tests/performance

  quality:
    name: quality
    if: always()
    needs: [portable, behavior]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the historical required-check contract
        env:
          PORTABLE_RESULT: ${{ needs.portable.result }}
          BEHAVIOR_RESULT: ${{ needs.behavior.result }}
        run: |
          test "$PORTABLE_RESULT" = success
          test "$BEHAVIOR_RESULT" = success
