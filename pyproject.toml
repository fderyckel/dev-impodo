[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-migration-profiler"
version = "0.0.0"
description = "Model-agnostic, read-only Odoo migration preflight engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7,<1",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "keyring>=25,<26",
  "openpyxl>=3.1,<4",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
impodo = "uc_migration_profiler.web.launcher:main"
uc-profiler = "uc_migration_profiler.cli:main"

[project.optional-dependencies]
test = [
  "httpx2>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uc_migration_profiler = [
  "resources/*.mjs",
  "web/static/*",
  "web/templates/*.html",
]
