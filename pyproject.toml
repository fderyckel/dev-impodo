[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "impodo"
version = "0.0.0"
description = "Local Odoo migration preparation, preflight, and practical loading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=49,<51",
  "defusedxml>=0.7,<1",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "keyring>=25,<26",
  "openpyxl>=3.1,<4",
  "polars==1.43.2",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.scripts]
impodo = "impodo.web.launcher:main"
impodo-cli = "impodo.cli:main"

[project.optional-dependencies]
test = [
  "httpx2>=2,<3",
]
release = [
  "build==1.5.0",
  "cyclonedx-bom==7.3.1",
  "detect-secrets==1.5.0",
  "pip-audit==2.10.1",
  "setuptools==83.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impodo = [
  "web/static/*",
  "web/templates/*.html",
]
