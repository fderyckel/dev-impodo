[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-migration-profiler"
version = "0.0.0"
description = "Model-agnostic, read-only Odoo migration preflight engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
uc-profiler = "uc_migration_profiler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uc_migration_profiler = ["resources/*.mjs"]
