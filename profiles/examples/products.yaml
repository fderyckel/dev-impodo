profile:
  id: products_example
  description: Product profile with scoped identity and target-only references

datasets:
  - name: products
    source:
      file: products.csv
    target:
      model: product.template
      mode: upsert
    source_identity:
      fields: [article_code, company_code]
    target_identity:
      components:
        - source_fields: [article_code]
          target_fields: [default_code]
          type: string
          normalize:
            trim: true
      scope:
        - source_fields: [company_code]
          target_fields: [company_id]
          resolve:
            target_model: res.company
            target_fields: [x_uc_code]
    fields:
      name:
        source: description
        type: string
        required: true
        required_on_create: true
        compare: true
        normalize:
          trim: true
          collapse_whitespace: true
      active:
        source: active
        type: boolean
        required: true
        compare: true
    relations:
      uom_id:
        kind: many2one
        source_fields: [uom_code]
        resolve:
          target_model: uom.uom
          target_fields: [x_uc_code]
        required: true
        required_on_create: true
        compare: true
